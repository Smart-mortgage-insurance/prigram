name: Update news feed

on:
  schedule:
    - cron: "*/15 * * * *"   # fallback only: GitHub delays scheduled runs by hours
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # lets a finished run start the next one

# a newly launched run replaces the running loop -> continuous, no overlap
concurrency:
  group: prigram-feed
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Continuous scrape (refresh every ~minute, for 20 minutes)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git config user.name  "פריגרם"
          git config user.email "bot@prigram.local"
          END=$((SECONDS + 1200))
          while [ $SECONDS -lt $END ]; do
            python scraper/scrape.py || echo "scrape error, continuing"
            git add data/
            if git diff --cached --quiet; then
              echo "no changes this cycle"
            else
              git commit -m "עדכון פיד [skip ci]"
              git push || { git pull --rebase --autostash origin main && git push; }
            fi
            sleep 60
          done

      # Chain: start the next run ourselves instead of waiting for the schedule.
      # Skipped when this run was cancelled (a newer run already replaced it).
      - name: Start the next run
        if: ${{ success() || failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-news.yml --repo "$GITHUB_REPOSITORY" --ref main
