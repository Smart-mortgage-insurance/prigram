<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>נטגרם</title>
<style>
  :root{--tg:#658e86;--tg-deep:#4a726a;--tg-soft:#e6efed;--ink:#1f2a33;--mute:#6b7a86;--line:#dfe7ec}
  *{box-sizing:border-box}
  body{margin:0;width:360px;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:#f4f7f8;font-size:14px;line-height:1.45}
  header{background:var(--tg-deep);color:#fff;padding:11px 14px;display:flex;align-items:center;gap:10px}
  header b{font-size:16px;flex:1}
  header button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:999px;padding:6px 12px;font:inherit;font-weight:600;font-size:12.5px;cursor:pointer}
  header button:hover{background:rgba(255,255,255,.28)}
  .bar{display:flex;align-items:center;gap:8px;padding:9px 14px;background:#fff;border-bottom:1px solid var(--line);font-size:13px}
  .bar label{display:flex;align-items:center;gap:7px;cursor:pointer;flex:1;font-weight:600}
  .bar input{accent-color:var(--tg-deep);width:16px;height:16px}
  .bar a{color:var(--tg-deep);font-weight:600;text-decoration:none;cursor:pointer}
  #list{max-height:400px;overflow:auto;padding:8px}
  .it{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:7px;cursor:pointer}
  .it:hover{border-color:var(--tg)}
  .it .h{display:flex;gap:8px;align-items:center;font-size:12.5px;margin-bottom:2px}
  .it .n{font-weight:700;color:var(--tg-deep);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .it .t{color:var(--mute);flex-shrink:0}
  .it .m{background:none;border:0;padding:0 2px;cursor:pointer;color:var(--mute);font-size:13px}
  .it .x{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;font-size:13.5px}
  .empty{text-align:center;color:var(--mute);padding:28px 10px}
  #muted{padding:0 14px 10px;font-size:12.5px;color:var(--mute)}
  #muted button{background:var(--tg-soft);border:0;border-radius:999px;padding:3px 9px;margin:3px 0 0 4px;font:inherit;font-size:12px;cursor:pointer;color:var(--tg-deep)}
</style>
</head>
<body>
<header><b>נטגרם</b><button id="open">פתיחת האתר</button></header>
<div class="bar">
  <label><input type="checkbox" id="enabled"> להקפיץ חלונית על עדכון חדש</label>
  <a id="msg">הודעה למערכת</a>
</div>
<div id="list"><div class="empty">טוען…</div></div>
<div id="muted"></div>
<script src="popup.js"></script>
</body>
</html>
